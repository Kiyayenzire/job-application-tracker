services:
  db:
    environment:
      MYSQL_DATABASE: job_tracker_dev
      MYSQL_USER: job_tracker_dev
      MYSQL_PASSWORD: local-development-only-password
      MYSQL_ROOT_PASSWORD: local-development-root-password
    restart: unless-stopped

  backend:
    build:
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    env_file:
      - .env
      - .env.dev
    environment:
      DJANGO_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    command: python manage.py runserver 0.0.0.0:8007
    volumes:
      - ./jat_backend:/app
    ports:
      - "8007:8007"
    restart: unless-stopped

  frontend:
    build:
      context: ./jat_frontend
      target: build
    env_file:
      - .env.dev
    command: npm run dev -- --host 0.0.0.0 --port 5177
    volumes:
      - ./jat_frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5177:5177"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
