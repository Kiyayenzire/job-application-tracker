services:
  db:
    environment:
      MYSQL_DATABASE: job_tracker_dev
      MYSQL_USER: job_tracker_dev
      MYSQL_PASSWORD: local-development-only-password
      MYSQL_ROOT_PASSWORD: local-development-root-password
    restart: unless-stopped

  migration:
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: job_tracker_dev
      DB_USER: job_tracker_dev
      DB_PASSWORD: local-development-only-password
    command: >
      sh -c "
      echo 'Waiting for database connection...' &&
      python -c \"import time, socket; 
      exec('''
      while True:
          try:
              socket.create_connection(('db', 3306), timeout=2)
              print('Database connection successful!')
              break
          except OSError:
              time.sleep(1)
      ''')\" &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
      "

  backend:
    image: job-application-tracker-backend:dev
    build:
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    env_file:
      - .env
      - .env.dev
    environment:
      DJANGO_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    command: python manage.py runserver 0.0.0.0:8007
    volumes:
      - ./jat_backend:/app
    ports:
      - "8007:8007"
    restart: unless-stopped

  frontend:
    image: job-application-tracker-frontend:dev
    build:
      context: ./jat_frontend
      target: build
    env_file:
      - .env.dev
    command: npm run dev -- --host 0.0.0.0 --port 5177
    volumes:
      - ./jat_frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5177:5177"
    depends_on:
      - backend

volumes:
  frontend_node_modules: