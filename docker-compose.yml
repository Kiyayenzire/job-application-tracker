services:
  db:
    image: mysql:8.4
    container_name: jat_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in .env}}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

  migration:
    image: ghcr.io/kiyayenzire/jat_backend:${IMAGE_TAG:-latest}
    container_name: jat_migration
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/kiyayenzire/jat_backend:${IMAGE_TAG:-latest}
    container_name: jat_backend
    restart: always
    ports:
      - "127.0.0.1:8007:8007"
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/kiyayenzire/jat_frontend:${IMAGE_TAG:-latest}
    container_name: jat_frontend
    restart: always
    ports:
      - "127.0.0.1:5177:5177"
    depends_on:
      - backend

volumes:
  db_data: