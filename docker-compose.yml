services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in .env}}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./jat_backend
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    env_file:
      - .env
    environment:
      DJANGO_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    command: gunicorn jat.wsgi:application --bind 0.0.0.0:8007
    ports:
      - "8007:8007"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./jat_frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5177:5177"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  db_data:
